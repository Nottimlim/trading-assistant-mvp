<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            color: white;
        }
        .glass {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            transition: opacity 0.3s ease;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        .button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: background 0.3s;
        }
        .button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="glass">
        <h2>Trading Rules</h2>
        <div class="form-group">
            <label for="maxTrades">Max Trades Per Day</label>
            <input type="number" id="maxTrades" value="2" min="1" max="10">
        </div>
        <div class="form-group">
            <label for="riskPercent">Risk Per Trade (%)</label>
            <input type="number" id="riskPercent" value="1" min="0.1" max="5" step="0.1">
        </div>
        <div class="form-group">
            <label for="timeoutMinutes">Timeout Duration (minutes)</label>
            <input type="number" id="timeoutMinutes" value="15" min="5" max="60">
        </div>
        <button class="button" onclick="updateRules()">Update Rules</button>
        <button class="button" onclick="closeSettings()">Close</button>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        
        function updateRules() {
            const rules = {
                maxTrades: parseInt(document.getElementById('maxTrades').value),
                riskPercent: parseFloat(document.getElementById('riskPercent').value),
                timeoutMinutes: parseInt(document.getElementById('timeoutMinutes').value)
            };
            
            ipcRenderer.send('update-rules', rules);
            alert('Rules updated!');
        }
        
        function closeSettings() {
            ipcRenderer.send('close-settings');
        }
    </script>
</body>
</html>
