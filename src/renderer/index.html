<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trading Dashboard Overlay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            color: white;
            user-select: none;
            cursor: move;  /* Draggable indicator */
        }
        .glass {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0.8;
            min-width: 250px;
            min-height: 250px;  /* Increased for button/log visibility, adaptive to content */
            display: flex;
            flex-direction: column;
        }
        .glass:hover {
            opacity: 1;
            transform: scale(1.05);
        }
        .metric {
            font-size: 1.1em;
            margin: 5px 0;
            white-space: nowrap;
        }
        .trade-log {
            max-height: 100px;  /* Shortened to prevent scroll-hiding button */
            overflow-y: auto;
            margin-top: 10px;
            font-size: 0.9em;
            flex-grow: 1;  /* Grow to fill space */
        }
        .trade-entry {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px;
            border-radius: 5px;
            margin-bottom: 5px;
            border-left: 4px solid #4CAF50;
        }
        .trade-entry.loss {
            border-left-color: #f44336;
        }
        .button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
            width: 100%;
        }
        .button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .settings-btn {
            position: absolute;
            top: 5px;
            right: 25px;  /* Shifted right to avoid overlap with indicator */
            cursor: pointer;
            font-size: 1.2em;
            opacity: 0.5;
            transition: opacity 0.3s, transform 0.3s;
        }
        .settings-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }
        .monitoring-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f44336;
            position: absolute;
            top: 5px;
            right: 5px;
        }
        .monitoring-indicator.active {
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body draggable="true">
    <div class="glass" onmouseenter="enableInteraction()" onmouseleave="disableInteraction()">
        <div class="monitoring-indicator" id="monitoringIndicator"></div>
        <div class="settings-btn" onclick="openSettings()">•••</div>
        <div class="metric">Balance: <span id="currentBalance">$0.00</span></div>
        <div class="metric">Equity: <span id="currentEquity">$0.00</span></div>
        <div class="metric">Profit: <span id="todayProfit">$0.00</span></div>
        <div class="metric">Trades: <span id="tradesCount">0</span></div>
        <div class="trade-log" id="tradeLog"></div>
        <button class="button" onclick="startSession()">Start Session</button>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        
        let isMonitoring = false;
        
        function enableInteraction() {
            ipcRenderer.send('enable-interaction');
        }
        
        function disableInteraction() {
            ipcRenderer.send('disable-interaction');
        }
        
        function openSettings() {
            ipcRenderer.send('open-settings');
        }
        
        function startSession() {
            const balanceInput = prompt('Enter starting balance (e.g., 93905.13):');
            const startingBalance = parseFloat(balanceInput);
            if (!isNaN(startingBalance) && startingBalance > 0) {
                ipcRenderer.send('start-session', startingBalance);
                addLogEntry('Session started with balance: $' + startingBalance.toFixed(2), 'system');
            } else {
                alert('Invalid balance - enter a positive number.');
            }
        }
        
        function updateMonitoringIndicator() {
            const indicator = document.getElementById('monitoringIndicator');
            indicator.classList.toggle('active', isMonitoring);
        }
        
        function addLogEntry(message, type = 'trade') {
            const log = document.getElementById('tradeLog');
            const entry = document.createElement('div');
            entry.className = `trade-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `<strong>${message}</strong><br><small>${timestamp}</small>`;
            log.insertBefore(entry, log.firstChild);
            if (log.children.length > 5) log.removeChild(log.lastChild);
        }
        
        ipcRenderer.on('trading-data-update', (event, data) => {
            document.getElementById('currentBalance').textContent = `$${data.balance.toFixed(2)}`;
            document.getElementById('currentEquity').textContent = `$${data.equity.toFixed(2)}`;
            document.getElementById('todayProfit').textContent = `$${data.profit.toFixed(2)}`;
            document.getElementById('tradesCount').textContent = data.tradesCount;
            
            if (data.tradesCount > 0) {
                addLogEntry(`Trade detected! Total: ${data.tradesCount}`, 'trade');
            }
        });
        
        // Drag-to-move
        let isDragging = false, startX, startY;
        document.body.addEventListener('mousedown', (e) => {
            if (e.target.className !== 'settings-btn' && e.target.tagName !== 'BUTTON') {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
            }
        });
        document.body.addEventListener('mousemove', (e) => {
            if (isDragging) {
                ipcRenderer.send('move-window', { dx: e.clientX - startX, dy: e.clientY - startY });
                startX = e.clientX;
                startY = e.clientY;
            }
        });
        document.body.addEventListener('mouseup', () => isDragging = false);
        
        // Initial log
        addLogEntry('System Started - Ready to monitor MatchTrader', 'system');
    </script>
</body>
</html>
